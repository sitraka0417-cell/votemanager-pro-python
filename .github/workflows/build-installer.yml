name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build app folder with PyInstaller (onedir)
        run: pyinstaller --noconfirm --windowed --name VoteManagerPro --collect-all PyQt6 main.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer with Inno Setup
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoteManagerPro-Installer
          path: installer/installer_output/VoteManagerPro-Setup.exe
