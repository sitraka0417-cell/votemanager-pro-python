name: Build Windows EXE (Python)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: pyinstaller --noconfirm --windowed --onefile --name VoteManagerPro --collect-all PyQt6 main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoteManagerPro-Windows
          path: dist/VoteManagerPro.exe
